<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Calorías</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Contenedor principal de la aplicación -->
    <div class="container">
        
        <!-- Encabezado con título y descripción -->
        <header class="header">
            <h1>🍽️ Calculadora de Calorías</h1>
            <p>
                Sube una imagen de tu plato de comida y obtén una estimación 
                de calorías y macronutrientes (proteínas, grasas y carbohidratos).
            </p>
        </header>

        <!-- Sección para subir imagen -->
        <section class="upload-section">
            <label for="inputImagen">Selecciona una imagen de tu comida:</label>
            <input 
                type="file" 
                id="inputImagen" 
                accept="image/*"
                aria-label="Seleccionar imagen de comida"
            >
        </section>

        <!-- Botón para analizar la imagen -->
        <button id="botonAnalizar" class="analyze-button">
            Analizar
        </button>

        <!-- Sección de resultados (inicialmente oculta) -->
        <section id="seccionResultados" class="results-section hidden">
            <h2>📊 Resultados del Análisis</h2>
            <div id="contenidoResultados" class="results-content">
                <!-- Los resultados se mostrarán aquí dinámicamente -->
                <p>Aquí se mostrarán los resultados del análisis...</p>
            </div>
        </section>

    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
